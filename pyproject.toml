[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-vegetation"
version = "0.1.0"
description = "Vegetation/vigor analytics engine for surveying and remote sensing: per-zone vigor time series, phenology-aware anomaly detection, growing-season summaries, and vigor-class maps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["surveying", "remote-sensing", "vegetation", "ndvi", "agriculture", "phenology", "sentinel-2", "landsat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
# The engine core is stdlib+numpy on purpose. Spectral-index math is reused
# from survey-imagery (lazy import); real satellite acquisition needs
# survey-imagery + rasterio; GeoTIFF output needs rasterio.
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
acquire = ["survey-imagery"]
raster = ["rasterio>=1.3"]
full = ["survey-imagery", "rasterio>=1.3", "PyYAML>=6"]
dev = ["build", "twine", "pytest"]

[project.scripts]
survey-vegetation = "vegetation.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-vegetation"
Repository = "https://github.com/crieck2010/survey-vegetation"
Issues = "https://github.com/crieck2010/survey-vegetation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
